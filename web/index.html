<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#255473">
  <meta name="color-scheme" content="light dark">
  <script src="js/theme.js?v=2.28.0"></script>
  <meta name="description" content="Task, deadline, dan laporan performa tim">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'">
  <title>Project Tracker</title>
  <link rel="manifest" href="manifest.webmanifest?v=2.28.0">
  <link rel="icon" type="image/png" href="icons/favicon-32.png?v=2.28.0">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2.28.0">
  <link rel="stylesheet" href="styles.css?v=2.28.0">
</head>
<body>
  <noscript><p style="padding:24px">Aktifkan JavaScript untuk memakai Project Tracker.</p></noscript>

  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="brand big"><img class="logo-img" src="icons/icon-192.png?v=2.28.0" alt=""><div><b>Project Tracker</b><small class="org">Linov<b>HR</b></small></div></div>
      <div id="auth-body"></div>
    </div>
  </section>

  <section id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><img class="logo-img" src="icons/icon-192.png?v=2.28.0" alt=""><div><b>Project Tracker</b><small class="org" id="demo-tag"></small></div></div>
      <nav id="nav" aria-label="Menu utama"></nav>
      <div class="me">
        <div class="avatar" id="me-avatar"></div>
        <div class="me-text"><b id="me-name"></b><small id="me-role"></small></div>
        <button class="btn sm ghost logout" id="btn-logout" title="Keluar dari akun" aria-label="Keluar">Keluar</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><h1 id="view-title"></h1><p id="view-sub" class="muted"></p></div>
        <div class="top-actions">
          <span id="sync-info" class="muted small"></span>
          <span class="nb-wrap hidden" id="nb-wrap"><button class="btn ghost icon-btn" id="btn-bell" title="Notifikasi" aria-label="Notifikasi" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="nb-count hidden" id="nb-count"></span></button><div class="nb-panel hidden" id="nb-panel" role="dialog" aria-label="Notifikasi"></div></span>
          <button class="btn ghost icon-btn" id="btn-theme" title="Ganti mode terang/gelap" aria-label="Ganti mode terang/gelap"></button>
          <button class="btn ghost" id="btn-refresh" title="Muat ulang data" aria-label="Muat ulang">⟳ <span class="hide-sm">Muat ulang</span></button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="config.js?v=2.28.0"></script>
  <script src="vendor/chart.umd.js?v=2.28.0"></script>
  <script src="js/logic.js?v=2.28.0"></script>
  <script src="js/demo.js?v=2.28.0"></script>
  <!--FIREBASE-->
  <script src="js/pt-web.js?v=2.28.0"></script>
  <script src="js/brief.js?v=2.28.0"></script>
  <script src="js/article.js?v=2.28.0"></script>
  <script src="js/social.js?v=2.28.0"></script>
  <script src="js/org.js?v=2.28.0"></script>
  <script src="js/briefdoc.js?v=2.28.0"></script>
  <script src="js/request.js?v=2.28.0"></script>
  <script src="js/schedule.js?v=2.28.0"></script>
  <script src="js/comments.js?v=2.28.0"></script>
  <script src="js/bell.js?v=2.28.0"></script>
  <script src="js/push.js?v=2.28.0"></script>
  <script src="js/detail.js?v=2.28.0"></script>
  <script src="js/app.js?v=2.28.0"></script>
</body>
</html>
